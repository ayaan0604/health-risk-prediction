<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Risk Prediction</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="prediction.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class = title>
             <a class = "name" href="/">Health Risk Prediction</a>
             <p class = "tag"> Predict Risk Based On Lifestyle Data</p>
        </div>
       
        <a href="/">Home</a>
    </nav>

    <div class="main-container">

        <!-- LEFT PANEL -->
        <section class="panel">

            <h1 class="panel-title">Enter Your Details</h1>

            <div class="form-inner">

                <form id="input-form">

                    <div class="form-grid">

                        <!-- Age -->
                        <div class="form-group">
                            <label for="age">Age</label>
                            <input
                                class="text-input"
                                id="age"
                                name="age"
                                type="number"
                                placeholder="Enter your age..."
                                required
                            >
                        </div>

                        <!-- Gender -->
                        <div class="form-group">
                            <label>Gender</label>

                            <div class="radio-group">
                                <label>
                                    <input type="radio" name="gender" value="male" required>
                                    Male
                                </label>

                                <label>
                                    <input type="radio" name="gender" value="female" required>
                                    Female
                                </label>
                            </div>
                        </div>

                        <!-- Smoke -->
                        <div class="form-group">
                            <label>Do you smoke?</label>

                            <div class="radio-group">
                                <label>
                                    <input type="radio" name="smoke" value="true" required>
                                    Yes
                                </label>

                                <label>
                                    <input type="radio" name="smoke" value="false" required>
                                    No
                                </label>
                            </div>
                        </div>

                        <!-- Alcohol -->
                        <div class="form-group">
                            <label>Do you drink alcohol?</label>

                            <div class="radio-group">
                                <label>
                                    <input type="radio" name="alco" value="true" required>
                                    Yes
                                </label>

                                <label>
                                    <input type="radio" name="alco" value="false" required>
                                    No
                                </label>
                            </div>
                        </div>

                        <!-- Activity -->
                        <div class="form-group">
                            <label>Are you physically active?</label>

                            <div class="radio-group">
                                <label>
                                    <input type="radio" name="active" value="true" required>
                                    Yes
                                </label>

                                <label>
                                    <input type="radio" name="active" value="false" required>
                                    No
                                </label>
                            </div>
                        </div>

                        <!-- Food -->
                        <div class="form-group">
                            <label>Do you eat high calorie food?</label>

                            <div class="radio-group">
                                <label>
                                    <input type="radio" name="caloric_food" value="true" required>
                                    Yes
                                </label>

                                <label>
                                    <input type="radio" name="caloric_food" value="false" required>
                                    No
                                </label>
                            </div>
                        </div>

                        <!-- Water -->
                        <div class="form-group">
                            <label>
                                Daily Water<br>
                                Intake (litres)
                            </label>

                            <input
                                class="text-input"
                                id="water_intake"
                                name="water_intake"
                                type="number"
                                placeholder="Enter water intake..."
                                required
                            >
                        </div>

                        <!-- Meals -->
                        <div class="form-group">
                            <label>
                                Number of meals<br>
                                taken in a day
                            </label>

                            <input
                                class="text-input"
                                id="meals"
                                name="meals"
                                type="number"
                                placeholder="Enter number..."
                                required
                            >
                        </div>

                        <!-- Height -->
                        <div class="form-group">
                            <label for="height_cm">Height (cm)</label>

                            <input
                                class="text-input"
                                id="height_cm"
                                name="height_cm"
                                type="number"
                                placeholder="Enter height..."
                                required
                            >
                        </div>

                        <!-- Weight -->
                        <div class="form-group">
                            <label for="weight">Weight (kg)</label>

                            <input
                                class="text-input"
                                id="weight"
                                name="weight"
                                type="number"
                                placeholder="Enter weight..."
                                required
                            >
                        </div>

                    </div>

                    <div class="submit-wrapper">
                        <button type="submit" class="submit-btn">
                            Get Your Risks
                        </button>
                    </div>

                </form>

            </div>

        </section>

        <!-- RIGHT PANEL -->
        <section class="panel">

            <h1 class="panel-title">Prediction Results</h1>

            <div class="result-inner">

                <div id="result">
                    <div id = "default-text" class="placeholder-text">
                        Fill the form to get started
                    </div>
                </div>

            </div>

        </section>

    </div>

    <script src="prediction.js"></script>

</body>
</html>
